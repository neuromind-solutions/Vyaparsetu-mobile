name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build Android Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android Project
        working-directory: frontend
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: npx cap sync android

      - name: Prepare Signing Keystore
        working-directory: frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using production keystore from repository secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/vyaparsetu-release.jks
          else
            echo "No KEYSTORE_BASE64 secret found. Generating automated self-signed release keystore..."
            keytool -genkeypair -v -keystore app/vyaparsetu-release.jks \
              -alias vyaparsetu -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "VyaparSetu2026!" -keypass "VyaparSetu2026!" \
              -dname "CN=VyapaarSetu, OU=Production, O=VyapaarSetu, L=Pune, ST=Maharashtra, C=IN"
          fi
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/frontend/android/app/vyaparsetu-release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-VyaparSetu2026!}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${KEY_ALIAS:-vyaparsetu}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${KEY_PASSWORD:-VyaparSetu2026!}" >> $GITHUB_ENV

      - name: Make Gradle Executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease

      - name: Build Release AAB (Google Play Bundle)
        working-directory: frontend/android
        run: ./gradlew bundleRelease

      - name: Organize Production Artifacts
        run: |
          mkdir -p build-output
          # Locate APK and copy
          APK_PATH=$(find frontend/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/VyapaarSetu-v1.0.0.apk
            echo "Copied APK: build-output/VyapaarSetu-v1.0.0.apk"
          fi
          # Locate AAB and copy
          AAB_PATH=$(find frontend/android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -f "$AAB_PATH" ]; then
            cp "$AAB_PATH" build-output/VyapaarSetu-v1.0.0.aab
            echo "Copied AAB: build-output/VyapaarSetu-v1.0.0.aab"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VyapaarSetu-APK
          path: build-output/*.apk
          retention-days: 30

      - name: Upload AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VyapaarSetu-AAB
          path: build-output/*.aab
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-output/VyapaarSetu-v1.0.0.apk
            build-output/VyapaarSetu-v1.0.0.aab
          generate_release_notes: true
          draft: false
          prerelease: false
